name: ci

on:
  push:
  pull_request:

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Evaluation dataset and scorer tests
        run: python3 -m unittest discover -s tests/evaluation -v
      - name: Download pinned model and ORT
        run: |
          ./scripts/download-model.sh
          ./scripts/download-ort.sh linux amd64
      - name: Unit and race tests
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Official Julia ONNX parity
        run: ODS_PARITY=1 go test ./internal/engine/julia -run TestOfficialONNXParity -v -count=1
      - name: Build Linux container
        uses: docker/setup-buildx-action@v3
      - name: Build image with layer cache
        run: docker buildx build --platform linux/amd64 -t ods-ci --load --cache-from type=gha --cache-to type=gha,mode=max .
      - name: Cache pinned d1 model
        uses: actions/cache@v4
        with:
          path: models/d1-2b
          key: d1-2b-model-073313d92b53b0ac8193db6e906cb3c78a98183d244b15b7b8f5426115c6738c
      - name: Download pinned d1 model
        run: ./scripts/download-d1-model.sh
      - name: Container HTTP smoke test
        run: |
          docker run -d --name ods-ci -p 18080:8080 -v "$PWD/models/d1-2b:/models/d1-2b:ro" ods-ci
          for i in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:18080/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health/ready
          go run ./cmd/odsbench -url http://127.0.0.1:18080/v1/systemone -model d1-2b -clients 16 -duration 30s -timeout 120s
          docker logs ods-ci
      - name: Stop container
        if: always()
        run: docker rm -f ods-ci || true
